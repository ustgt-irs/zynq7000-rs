[package]
name = "z7-run"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap-num = { version = "1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Must match x7dap's own probe-rs source exactly (see x7dap/Cargo.toml). A different source,
# even pointing at identical code, makes Cargo treat it as a distinct crate, breaking every
# JtagChain/ScanChainElement type shared between the two.
probe-rs = { git = "https://github.com/probe-rs/probe-rs.git", rev = "187f19a8ce463e75470f48583fb3a3986403b145" }
x7dap = { git = "https://github.com/ustgt-irs/x7dap.git", rev = "78a4ea747abcc54f6d80b7a94632907b43176fae" }
anyhow = { version = "1" }
ron = { version = "0.12" }
toml = "1.1.4"
serde = { version = "1", features = ["derive"] }
z7-ps7init = { path = "../z7-ps7init" }
serialport = { version = "4" }
indicatif = { version = "0.18" }
ctrlc = { version = "3" }
defmt-decoder = { version = "1" }
